name: MacOCR
options:
  bundleIdPrefix: com.macocr
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MacOCR:
    type: application
    platform: macOS
    sources:
      - path: MacOCR
    settings:
      base:
        INFOPLIST_FILE: MacOCR/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.macocr.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: MacOCR/Resources/MacOCR.entitlements
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: "Copy Python Backend"
        script: |
          SRC_DIR="${SRCROOT}/../PythonBackend"
          DST_DIR="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/python-backend"
          if [ -d "$SRC_DIR" ]; then
            rsync -a --delete "$SRC_DIR/" "$DST_DIR/" --exclude='__pycache__' --exclude='*.pyc'
          fi
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles: []
